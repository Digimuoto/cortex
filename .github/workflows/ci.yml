name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    accept-flake-config = true
    experimental-features = nix-command flakes
    extra-substituters = https://cache.digimuoto.com/digimuoto https://cache.iog.io https://cache.nixos.org
    extra-trusted-public-keys = digimuoto:GwbeTccfYk+oeV3BLGKC5gzqDJmbHYetR5x0TOBEBCA= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGkljaxJfsF5+0= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

jobs:
  changes:
    name: Detect Changes
    # Pull requests may contain untrusted code, so this workflow keeps PR jobs on
    # GitHub-hosted runners. Self-hosted Nix jobs below are gated to trusted
    # push/workflow_dispatch events before runner allocation.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      haskell: ${{ steps.filter.outputs.haskell }}
      theory: ${{ steps.filter.outputs.theory }}
      editor: ${{ steps.filter.outputs.editor }}
      nix: ${{ steps.filter.outputs.nix }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
            docs:
              - 'docs/**'
              - 'nix/agent-*.nix'
              - 'nix/docs.nix'
              - 'scripts/docs-lint'
            haskell:
              - 'app/**'
              - 'src/**'
              - 'src-platform/**'
              - 'test/**'
              - '.license-header.txt'
              - '.hlint.yaml'
              - 'cabal.project'
              - 'cortex.cabal'
              - 'fourmolu.yaml'
              - 'flake.lock'
              - 'flake.nix'
              - 'nix/**'
              - 'scripts/check-language-pragma-allowlist.sh'
              - 'scripts/check-logos-boundary.sh'
              - 'scripts/check-module-haddock.sh'
            theory:
              - 'theory/**'
              - 'nix/agent-*.nix'
              - 'nix/lean.nix'
              - 'scripts/lean-lint'
              - 'flake.lock'
              - 'flake.nix'
            editor:
              - 'editors/**'
              - 'nix/editors.nix'
              - 'flake.lock'
              - 'flake.nix'
            nix:
              - 'flake.lock'
              - 'flake.nix'
              - 'nix/**'
            site:
              - 'docs/**'
              - 'theory/**'
              - 'editors/tree-sitter-wire/**'
              - 'src/**'
              - 'src-platform/**'
              - 'app/**'
              - 'cortex.cabal'
              - 'cabal.project'
              - 'flake.lock'
              - 'flake.nix'
              - 'nix/**'
              - '.github/workflows/docs.yml'

  commit-provenance:
    name: Commit Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Check commit provenance
        env:
          BEFORE: ${{ github.event.before }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            git fetch --no-tags "$PR_HEAD_REPOSITORY" "+refs/heads/${PR_HEAD_REF}:refs/remotes/pr/head"

            actual_head="$(git rev-parse refs/remotes/pr/head)"
            if [[ "$actual_head" != "$PR_HEAD_SHA" ]]; then
              echo "PR head moved while checking provenance: expected $PR_HEAD_SHA, got $actual_head" >&2
              exit 1
            fi

            RANGE="origin/${GITHUB_BASE_REF}..refs/remotes/pr/head"
          else
            if [[ "${BEFORE:-}" =~ ^0+$ || -z "${BEFORE:-}" ]]; then
              RANGE="$GITHUB_SHA"
            else
              RANGE="${BEFORE}..${GITHUB_SHA}"
            fi
          fi

          scripts/check-commit-provenance "$RANGE"

  repository-merge-policy:
    name: Repository Merge Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Check GitHub merge policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-github-merge-policy

  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check commit messages
        uses: webiny/action-conventional-commits@v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventional-pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check PR title
        uses: CondeNast/conventional-pull-request-action@v0.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format-check:
    name: Format Check
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes]
    if: |
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.code != 'false' ||
        needs.changes.outputs.docs != 'false'
      )
    timeout-minutes: 15
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Check disk space
        run: |
          echo "## Disk Space" >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"
          DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          if [ "$DISK_USAGE" -gt 90 ]; then
            echo "Warning: disk usage is at ${DISK_USAGE}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check formatting
        run: nix run '.#_check-format' --print-build-logs

      - name: Check Haskell formatting
        run: nix run '.#check-haskell-format' --print-build-logs

  supported-build:
    name: Build Supported Outputs
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, format-check]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.format-check.result == 'success' || needs.format-check.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.haskell != 'false' ||
        needs.changes.outputs.theory != 'false' ||
        needs.changes.outputs.editor != 'false' ||
        needs.changes.outputs.nix != 'false'
      )
    timeout-minutes: 90
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build all supported outputs
        run: |
          set -euo pipefail

          for pkg in \
            cortex \
            cortex-pulse \
            cortex-tests \
            cortex-theory \
            tree-sitter-wire \
            tree-sitter-wire-plugin
          do
            nix build ".#$pkg" -o "result-$pkg" --print-build-logs
          done

          echo "All supported Cortex outputs built" >> "$GITHUB_STEP_SUMMARY"

      - name: Push build outputs to Attic
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          ATTIC_AUTH_TOKEN: ${{ secrets.ATTIC_AUTH_TOKEN }}
          ATTIC_CACHE_NAME: ${{ secrets.ATTIC_CACHE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${ATTIC_AUTH_TOKEN:-}" ] || [ -z "${ATTIC_CACHE_NAME:-}" ]; then
            echo "Attic cache secrets are not configured; skipping cache push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          nix run github:zhaofengli/attic -- \
            login digimuoto http://localhost:8088 "$ATTIC_AUTH_TOKEN"
          nix run github:zhaofengli/attic -- \
            push "$ATTIC_CACHE_NAME" \
              result-cortex \
              result-cortex-pulse \
              result-cortex-tests \
              result-cortex-theory \
              result-tree-sitter-wire \
              result-tree-sitter-wire-plugin

          echo "Build artifacts pushed to Attic" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint Haskell
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, supported-build]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.supported-build.result == 'success' || needs.supported-build.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.haskell != 'false'
      )
    timeout-minutes: 20
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run HLint
        run: nix run '.#lint-haskell' --print-build-logs

      - name: Check language pragmas
        run: nix run '.#check-language-pragmas' --print-build-logs

      - name: Check module Haddock
        run: nix run '.#check-module-haddock' --print-build-logs

      - name: Check Logos import boundary
        run: nix run '.#check-logos-boundary' --print-build-logs

  lean-lint:
    name: Lint Lean
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, supported-build]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.supported-build.result == 'success' || needs.supported-build.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.theory != 'false' ||
        needs.changes.outputs.nix != 'false'
      )
    timeout-minutes: 10
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run Lean lint
        run: nix run '.#lean-lint' --print-build-logs

  lean-theory:
    name: Lean Theory
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, supported-build, lean-lint]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.supported-build.result == 'success' || needs.supported-build.result == 'skipped') &&
      (needs.lean-lint.result == 'success' || needs.lean-lint.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.theory != 'false' ||
        needs.changes.outputs.nix != 'false'
      )
    timeout-minutes: 20
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build Lean theory
        run: nix run '.#_check-theory' --print-build-logs

  flake-check:
    name: Flake Check
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, supported-build]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.supported-build.result == 'success' || needs.supported-build.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.haskell != 'false' ||
        needs.changes.outputs.theory != 'false' ||
        needs.changes.outputs.editor != 'false' ||
        needs.changes.outputs.nix != 'false'
      )
    timeout-minutes: 45
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Trust GitHub SSH host key
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan github.com >> ~/.ssh/known_hosts

          if [ -w /etc/ssh/ssh_known_hosts ]; then
            ssh-keyscan github.com >> /etc/ssh/ssh_known_hosts
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            ssh-keyscan github.com | sudo tee -a /etc/ssh/ssh_known_hosts >/dev/null
          fi

      - name: Run flake checks
        env:
          GIT_SSH_COMMAND: ssh -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: nix flake check --print-build-logs

  test:
    name: Test Haskell
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, supported-build]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.supported-build.result == 'success' || needs.supported-build.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.haskell != 'false'
      )
    timeout-minutes: 45
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run Haskell test suites
        run: nix run '.#cortex-tests' --print-build-logs

  docs-lint:
    name: Lint Docs
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes]
    if: |
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.docs != 'false' ||
        needs.changes.outputs.nix != 'false'
      )
    timeout-minutes: 10
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run docs lint
        run: nix run '.#docs-lint' --print-build-logs

  docs-build:
    name: Build Docs
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: [changes, docs-lint]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.docs-lint.result == 'success' || needs.docs-lint.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.site != 'false'
      )
    timeout-minutes: 30
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build documentation site
        run: nix build '.#docs-site' --print-build-logs

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - changes
      - commit-provenance
      - repository-merge-policy
      - conventional-commits
      - conventional-pr-title
      - format-check
      - supported-build
      - lint
      - lean-lint
      - lean-theory
      - flake-check
      - test
      - docs-lint
      - docs-build
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        run: |
          set -euo pipefail

          results=(
            "${{ needs.changes.result }}"
            "${{ needs.commit-provenance.result }}"
            "${{ needs.repository-merge-policy.result }}"
            "${{ needs.conventional-commits.result }}"
            "${{ needs.conventional-pr-title.result }}"
            "${{ needs.format-check.result }}"
            "${{ needs.supported-build.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.lean-lint.result }}"
            "${{ needs.lean-theory.result }}"
            "${{ needs.flake-check.result }}"
            "${{ needs.test.result }}"
            "${{ needs.docs-lint.result }}"
            "${{ needs.docs-build.result }}"
          )

          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more CI jobs failed"
              exit 1
            fi
          done

          echo "All CI jobs passed successfully"
