name: Deploy Documentation

on:
  push:
    branches: [main, scaffold]
    paths:
      - "docs/**"
      - "theory/**"
      - "editors/tree-sitter-wire/**"
      - "src/**"
      - "src-platform/**"
      - "app/**"
      - "cortex.cabal"
      - "cabal.project"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    accept-flake-config = true
    experimental-features = nix-command flakes
    extra-substituters = https://cache.digimuoto.com/digimuoto https://cache.iog.io https://cache.nixos.org
    extra-trusted-public-keys = digimuoto:GwbeTccfYk+oeV3BLGKC5gzqDJmbHYetR5x0TOBEBCA= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGkljaxJfsF5+0= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

jobs:
  build:
    runs-on: [self-hosted, nix, mercury, cortex]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Restore workspace permissions
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build documentation
        run: |
          chmod -R u+w _site result-docs-site 2>/dev/null || true
          rm -rf _site result-docs-site
          nix build .#docs-site --out-link result-docs-site --print-build-logs
          mkdir -p _site
          cp -a result-docs-site/. _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, nix, mercury, cortex]
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
