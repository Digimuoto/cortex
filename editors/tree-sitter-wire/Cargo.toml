[package]
name = "tree-sitter-wire"
description = "Tree-sitter grammar for the Cortex Wire DSL"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "README.md",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tree-sitter = "0.25"
